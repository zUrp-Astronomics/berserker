name: Berserker
tagline: State-of-the-art harmonic equatorial mount, 3D printed with CNC machined core.
slogan: Forward to the stars
category: Mount
section: mounts           # mounts | cameras | gadgets | future
status: wip               # wip | future | released — décidé par l'humain, jamais déduit d'une release

description:
  - >-
    Berserker is a state-of-the-art harmonic equatorial mount. 3D printed outer body, CNC machined
    structural core. Meant for heavier payloads than Kaiju — SCT, astrographs, long focal lengths.
  - >-
    The design mixes FDM for the accessible parts and machined alu for the precision and rigidity
    surfaces. Open hardware all the way down — BOM, STEP, G-code, firmware.

poster: berserker.webp    # à côté de cette fiche — l'affiche série 2 (1254 × 1254)
posterAlt: >-
  Berserker poster on a worn, chipped cream plate: an orange-plated mechanical centaur archer with
  antlers, glowing eyes and a mane of orange flames draws its bow and looses a laser arrow, hooves
  on rocky ground, in front of the full moon, orange rays and blueprint sketches, above the slogan
  “Forward to the stars”.
accent: '#f75404'         # couleur des rayons de l'affiche
